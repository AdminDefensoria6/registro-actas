<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro de actas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}
:root{--pad:clamp(12px,2.6vmin,32px);--gap:clamp(12px,2.6vmin,32px);--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ink:#0b1f3a;--mut:#64748b;--bd:#e2e8f0;--bg:#eef1f6;--card:#fff;--field:#f6f8fc;--ac:#2563eb;--ac2:#4f46e5;--ease:cubic-bezier(.16,1,.3,1);--c-ind:#4f46e5;--c-grn:#065f46;--ok:#047857;--aviso:#b45309;--error:#b91c1c;--rad:clamp(22px,3.6vmin,40px);--accent:var(--c-ind);--a1:#06b6d4;--a2:#818cf8;--a3:#4338ca;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e6eeff;--mut:#93a7cb;--bd:#1f3560;--bg:#071225;--card:#0f213f;--field:#0a1a33;--ac:#60a5fa;--ac2:#818cf8;--c-ind:#818cf8;--c-grn:#34d399;--ok:#34d399;--aviso:#fbbf24;--error:#f87171;color-scheme:dark}}
/* derivados del acento: se recalculan en cada tarjeta según su --accent */
:root,.sello,.panel,.tabla,dialog{--tint:color-mix(in srgb,var(--accent) 10%,var(--card));--lc:color-mix(in srgb,var(--accent) 14%,var(--bd));--glow:color-mix(in srgb,var(--accent) 32%,transparent)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1360px;margin:0 auto;padding:var(--pad) var(--pad) calc(var(--pad)*2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
h1,h2{font-family:var(--font)}
h1{font-size:clamp(1.5rem,3.6vmin,2.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.tenue{color:var(--mut);font-size:.82rem;font-weight:500}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:var(--gap)}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* tarjetas: borde fino con arco de luz que orbita (igual que los módulos) */
.sello,.panel,.tabla,dialog{--ang:0deg;--arc:70deg;border:1.5px solid transparent;border-radius:var(--rad);color:var(--ink);
background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,linear-gradient(var(--lc),var(--lc)) border-box;
box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14)}
.sello,.panel,.tabla{animation:orbit 9s linear infinite,fadeInUp .6s var(--ease) backwards;transition:transform .35s var(--ease),box-shadow .35s,--arc .5s}
.panel{--accent:var(--c-grn);--a2:#10b981;--a3:#065f46;animation-delay:-4.5s,.12s}
.tabla{animation-delay:-2s,.24s}
@keyframes orbit{to{--ang:360deg}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.sello:hover,.panel:hover{--arc:150deg;transform:translateY(-4px);box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -20px var(--glow)}
.tabla:hover{--arc:150deg;box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -24px var(--glow)}

/* botones */
.btn{font:700 .88rem var(--font);padding:.6em 1.15em;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--accent) 22%,var(--bd));background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:.5em;align-items:center;justify-content:center;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s,color .3s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent);box-shadow:0 12px 24px -14px var(--glow)}
.btn.pri{background:linear-gradient(135deg,var(--a2),var(--a3));border-color:transparent;color:#fff}
.btn.pri:hover{color:#fff;box-shadow:0 14px 26px -12px var(--glow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
kbd{font:700 .7rem var(--font);border:1px solid currentColor;border-radius:6px;padding:0 6px;opacity:.75}

/* hero */
.hero{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.sello{padding:clamp(1rem,3vmin,1.6rem) clamp(1rem,3vmin,1.8rem);text-align:center;color:var(--accent);display:flex;flex-direction:column;justify-content:center}
.sello small{display:block;font-size:.82rem;font-weight:600;color:var(--mut)}
.num{font-family:var(--font);font-size:clamp(3.2rem,9vmin,4.8rem);line-height:1.05;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:4px 0;color:var(--accent)}
.num span{font-size:.4em;font-weight:600;letter-spacing:-.02em;color:var(--mut)}
.panel{padding:clamp(1rem,2.6vmin,1.4rem) clamp(1rem,3vmin,1.6rem)}
.pill{font:700 .8rem var(--font);border-radius:999px;padding:.25em 1em;border:1px solid;background:var(--tint);cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px currentColor}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.pill.bad{color:var(--aviso);border-color:color-mix(in srgb,var(--aviso) 35%,transparent);background:color-mix(in srgb,var(--aviso) 10%,var(--card))}
.kpis{display:flex;flex-wrap:wrap;gap:6px 26px;margin:14px 0}
.kpis b{display:block;font:800 1.55rem/1.1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:78px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.68rem;font-weight:600;color:var(--mut)}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--a2),var(--a3));border-radius:7px 7px 3px 3px;min-height:3px;margin-bottom:2px;transition:filter .3s}
.bars div:hover i{filter:brightness(1.15) saturate(1.1)}

/* filtros y campos */
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr auto;gap:8px;margin-bottom:var(--gap)}
input,select,textarea{font:inherit;width:100%;padding:.6em .95em;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--ink);transition:border-color .25s,box-shadow .25s}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[readonly]{background:var(--field);color:var(--mut);cursor:not-allowed}

/* tabla */
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:.75em 1em;text-align:left;border-bottom:1px solid var(--bd);font-size:.87rem;vertical-align:middle}
th{font-weight:700;color:var(--mut);background:var(--tint);white-space:nowrap}
th.ord{cursor:pointer;color:var(--accent)}
tbody tr{cursor:pointer;transition:background .25s}tbody tr:hover{background:var(--tint)}tr:last-child td{border:0}
.n{font-size:1.15rem;font-weight:800;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}.n span{font-size:.8rem;font-weight:600;letter-spacing:0;color:var(--mut)}
.asunto{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:.2em .9em;border-radius:999px;font-size:.75rem;font-weight:700;line-height:1.4;color:var(--accent);background:var(--tint);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.tag.si{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tag.no{color:var(--aviso);background:color-mix(in srgb,var(--aviso) 10%,var(--card));border-color:color-mix(in srgb,var(--aviso) 30%,transparent)}
/* botón de ícono: mismo efecto de relleno y giro que el ícono de los módulos */
.ic{display:inline-flex;align-items:center;justify-content:center;width:2.3rem;height:2.3rem;padding:0;border:0;border-radius:30%;font-size:.9rem;color:var(--accent);cursor:pointer;background:linear-gradient(135deg,var(--a2),var(--a3)) center/0% 0% no-repeat,var(--tint);transition:background-size .4s var(--ease),color .3s,box-shadow .35s,transform .35s var(--ease)}
.ic:hover,.ic:focus-visible{background-size:100% 100%,auto;color:#fff;transform:rotate(-4deg) scale(1.08);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.vacio{padding:44px 16px;text-align:center;color:var(--mut);font-weight:500}
.pag{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:var(--gap)}

/* diálogos */
dialog{width:min(820px,94vw);max-height:92vh;padding:0;box-shadow:0 1px 2px rgba(15,23,42,.05),0 40px 80px -28px rgba(11,31,58,.55)}
dialog[open]{animation:orbit 9s linear infinite,fadeInUp .45s var(--ease) backwards}
dialog::backdrop{background:rgba(7,18,37,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.in{padding:clamp(1rem,3vmin,1.6rem)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dh h2{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}
.x{width:2.3rem;height:2.3rem;border:0;border-radius:30%;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--mut);transition:background .3s,color .3s,transform .35s var(--ease)}
.x:hover{background:var(--tint);color:var(--accent);transform:rotate(-4deg) scale(1.08)}
.df{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:0 20px}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:12px}
label input,label select,label textarea{margin-top:4px;font-weight:400}
label.rad{display:inline-flex;gap:6px;align-items:center;margin:0 16px 0 0}
fieldset{border:0;margin-bottom:12px}legend{font-size:.85rem;font-weight:600;margin-bottom:4px}
textarea{min-height:230px;resize:vertical;line-height:1.6}
.numbox{background:var(--tint);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.numbox b{font:800 1.4rem var(--font);letter-spacing:-.03em}
.av{font-size:.84rem;font-weight:500;padding:8px 12px;border-radius:12px;margin-top:8px;border-left:3px solid}
.av.aviso{background:color-mix(in srgb,var(--aviso) 12%,var(--card));border-color:var(--aviso);color:var(--ink)}.av.info{background:var(--tint);border-color:var(--accent)}
.lnk{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin-bottom:14px}
.dl dt{font-size:.75rem;font-weight:600;color:var(--mut)}.dl dd{font-weight:600;margin:0;word-break:break-word}
.texto{white-space:pre-wrap;word-break:break-word;font:inherit;line-height:1.7;background:var(--field);border:1.5px solid var(--bd);border-radius:16px;padding:16px;max-height:46vh;overflow:auto}
.chk{list-style:none;padding:0;display:grid;gap:8px;margin:12px 0}
.chk li{padding:10px 14px;border-radius:14px;border-left:4px solid;background:var(--field);display:flex;flex-direction:column}
.chk .ok{border-color:var(--ok)}.chk .bad{border-color:var(--aviso)}.chk span{font-size:.84rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b1f3a;color:#fff;font-weight:600;padding:.7em 1.4em;border-radius:999px;box-shadow:0 18px 40px -16px rgba(11,31,58,.6);z-index:99;max-width:92vw;animation:toastIn .4s var(--ease)}
#toast.error{background:#b91c1c}#toast.success{background:#047857}
@media(max-width:820px){.hero,.cols{grid-template-columns:1fr}.filtros{grid-template-columns:1fr 1fr}.filtros input:first-child{grid-column:1/-1}.hm{display:none}.num{font-size:3.2rem}}
@media(prefers-reduced-motion:reduce){
.sello,.panel,.tabla,dialog,dialog[open]{animation:none;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box}
#toast{animation:none}
*{transition:none!important}
.sello:hover,.panel:hover,.btn:hover,.pill:hover,.ic,.ic:hover,.ic:focus-visible,.x:hover{transform:none}}

/* ajustes propios de actas */
.av:not(.aviso){background:var(--tint);border-color:var(--accent)}
table{min-width:900px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Libro de actas</h1><p class="tenue" id="conn"></p></div>
    <div class="acts">
      <button class="btn" id="bExport"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
      <button class="btn" id="bAudit"><i class="fa-solid fa-list-check"></i> Auditar numeración</button>
      <button class="btn pri" id="bNew"><i class="fa-solid fa-plus"></i> Nueva acta <kbd>N</kbd></button>
    </div>
  </header>

  <section class="hero">
    <div class="sello"><small>Número actual</small><div class="num" id="nextNum">—</div><small id="nextHint"></small></div>
    <div class="panel">
      <button class="pill ok" id="integ"></button>
      <div class="kpis" id="kpis"></div>
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <section class="filtros">
    <input id="q" type="search" placeholder="Buscar por número, asunto, temática, contenido… ( / )" aria-label="Buscar">
    <select id="fy" aria-label="Año"></select>
    <select id="fm" aria-label="Mes"></select>
    <select id="ft" aria-label="Temática"></select>
    <button class="btn" id="bClear">Limpiar</button>
  </section>

  <div class="tabla">
    <table>
      <thead><tr><th class="ord" id="thN" title="Cambiar orden">N° ↓</th><th>Fecha de acta</th><th>Asunto</th><th>Temática</th><th class="hm">Usuario</th><th class="hm">Texto</th><th class="hm">Registrado</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="vacio" id="vacio" hidden>No hay actas que coincidan. <button class="lnk" id="vNew">Registrar una nueva</button></div>
  </div>
  <nav class="pag"><button class="btn" id="prev">Anterior</button><span class="tenue" id="pinfo"></span><button class="btn" id="next">Siguiente</button></nav>
</div>

<dialog id="dForm"><form class="in" id="form" novalidate>
  <div class="dh"><h2 id="fTitulo">Nueva acta</h2><button type="button" class="x" data-close aria-label="Cerrar">&times;</button></div>
  <div class="numbox" id="fNumBox"></div>
  <div class="cols">
    <div>
      <label>Asunto *<input id="fAsu"></label>
      <label>Fecha de acta <span class="tenue">(automática)</span><input id="fFec" readonly tabindex="-1" aria-readonly="true"></label>
      <label>Temática *<select id="fTopic"></select></label>
      <label>Usuario asignado<select id="fUser"></select></label>
      <fieldset><legend>Firma del defensor titular</legend>
        <label class="rad"><input type="radio" name="firma" value="Sí" checked> Sí</label>
        <label class="rad"><input type="radio" name="firma" value="No"> No</label>
        <label class="rad"><input type="radio" name="firma" value="No firma"> No firma</label></fieldset>
      <label id="subWrap" hidden>Defensor subrogante<input id="fSub" placeholder="Nombre del defensor subrogante"></label>
      <label id="secWrap" hidden>Secretario/a<select id="fSec"></select></label>
    </div>
    <div>
      <label>Expediente <span class="tenue">(opcional)</span><input id="fExp" placeholder="Número o referencia del expediente"></label>
      <label>Contenido del acta <span class="tenue" id="wc"></span> <button type="button" class="lnk" id="bClr">Limpiar</button><textarea id="fContent" placeholder="Escriba el contenido del acta aquí..."></textarea></label>
    </div>
  </div>
  <div id="avisos" aria-live="polite"></div>
  <div class="df"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" id="bSave">Guardar acta</button></div>
</form></dialog>

<dialog id="dView"><div class="in" id="vBody"></div></dialog>
<dialog id="dAudit"><div class="in" id="aBody"></div></dialog>
<dialog id="dExport"><div class="in" id="eBody"></div></dialog>
<div id="toast" hidden role="status"></div>

<script>
/* ============ CONFIG (base Firebase de actas) ============ */
const firebaseConfig={apiKey:"AIzaSyAtSSWM5UL65Y1xlC-0ca2rx5lOD-TJZxA",authDomain:"libro-actas.firebaseapp.com",projectId:"libro-actas",storageBucket:"libro-actas.firebasestorage.app",messagingSenderId:"945356506952",appId:"1:945356506952:web:778cfda4ccb53b5282957d"};
const USUARIOS=["Bazante Nadia Romina","Boillat Cesar Enrique","Cardozo Maria Raquel","Cedron Noelia Aurora","Corrales Alicia Mariela","Fioravante Romulo","Gonzalez Alberto Misael","Gonzalez Juan Jose","Gudiño Natalia Esther","Magnani Enzo Luciano","Martinis Carlos Esteban","Ortega Lucia Noemi","Pablos Patricia","Palacios Ana Gabriela","Ramos Marcelo Gustavo","Riveros Patricia Soledad","Sosa Rita Cecilia"];
const SECRETARIOS=["Alicia Mariela Corrales","Patricia Soledad Riveros","Enzo Luciano Magnani"];
const TEMAS=["Civil","Familia","Laboral","Otro","Penal","Violencia Familiar"];
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const POR_PAGINA=10, LOCAL="actas", ANIO_INICIO=2020;

/* ============ UTILIDADES ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms=t=>t?.toMillis?t.toMillis():t?(new Date(t).getTime()||0):0;
const fecha=s=>{s=s||'';if(s.includes('/'))return s;const p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s}; // AAAA-MM-DD → DD/MM/AAAA
const anioDe=s=>/^\d{4}/.test(s||'')?s.slice(0,4):String(s||'').split('/')[2]||'';
const mes=s=>parseInt(String(s||'').split(/[-\/]/)[1],10)||0;
const hoyIso=(t=Date.now())=>new Date(t).toLocaleDateString('sv-SE',{timeZone:'America/Argentina/Buenos_Aires'});
const fmtTs=t=>t?new Date(ms(t)).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',dateStyle:'short',timeStyle:'short',hour12:false}):'—';
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'').replace(/[.\-\/]/g,'');
let tt;function toast(msg,tipo='info'){const t=$('toast');t.textContent=msg;t.className=tipo;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)}
const opts=(arr,vacio)=>`<option value="">${vacio}</option>`+arr.map(v=>`<option>${esc(v)}</option>`).join('');
const firmaTxt=r=>r.firmaDefensor==='No firma'?'No firma'+(r.firmaSecretarioNombre?' · Secretario/a: '+r.firmaSecretarioNombre:''):r.firmaDefensor==='No'?'No'+(r.firmaDefensorSubrogante?' · Subrogante: '+r.firmaDefensorSubrogante:''):(r.firmaDefensor||'—');
const cmp=(a,b)=>(a.year-b.year)||((a.number||0)-(b.number||0));

/* ============ FIREBASE / ESTADO ============ */
let db=null,online=false,all=[],view=[],page=1,asc=false,editing=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();online=true}catch(e){console.warn(e)}
const FV=()=>firebase.firestore.FieldValue.serverTimestamp();
const col=()=>db.collection('actas');
const guardarLocal=()=>{try{localStorage.setItem(LOCAL,JSON.stringify(all))}catch(e){}};

/* ============ NUMERACIÓN POR AÑO (se reinicia cada año, según la fecha del acta) ============ */
const maxNum=y=>all.reduce((m,r)=>String(r.year)===String(y)&&Number.isInteger(r.number)?Math.max(m,r.number):m,0);
const proximo=y=>maxNum(y)+1;
async function siguiente(y){ // consulta al servidor el último número del año; si falla usa los datos cargados
  let n=proximo(y);
  if(online)try{const s=await col().where('year','==',y).orderBy('number','desc').limit(1).get();if(!s.empty)n=Math.max(n,s.docs[0].data().number+1)}catch(e){console.warn(e)}
  return n;
}
async function crear(data){
  const n=await siguiente(data.year);
  if(!online){all.push({...data,number:n,id:String(Date.now()),createdAt:new Date().toISOString()});guardarLocal();return n}
  const ref=await col().add({...data,number:n,createdAt:FV()}); // createdAt con reloj del servidor
  try{ // si el reloj de la PC no coincide con el del servidor, prevalece el del servidor
    const f=hoyIso(ms((await ref.get()).data({serverTimestamps:'estimate'}).createdAt));
    if(f!==data.dictamenDate){const y=f.slice(0,4),u={dictamenDate:f,year:y};if(y!==data.year)u.number=await siguiente(y);
      await ref.update(u);data.dictamenDate=f;data.year=y;return u.number??n}
  }catch(e){console.warn('No se pudo verificar la fecha con el servidor',e)}
  return n;
}
async function actualizar(id,data){
  if(!online){const i=all.findIndex(r=>r.id===id);all[i]={...all[i],...data,updatedAt:new Date().toISOString()};return guardarLocal()}
  return col().doc(id).update({...data,updatedAt:FV()});
}

/* ============ AUDITORÍA DE SECUENCIA (por año) ============ */
function analizar(){
  const g={};let sin=0;
  all.forEach(r=>Number.isInteger(r.number)?((g[r.year]??={})[r.number]??=[]).push(r):sin++);
  const dup=[],huecos=[],orden=[];
  Object.keys(g).sort().forEach(y=>{
    const G=g[y],nums=Object.keys(G).map(Number).sort((a,b)=>a-b),max=nums.at(-1)||0;let prev=0;
    nums.forEach(n=>{if(G[n].length>1)dup.push(`${n}/${y}`);const t=ms(G[n][0].createdAt);if(t){if(prev&&t<prev)orden.push(`${n}/${y}`);prev=t}});
    for(let i=1;i<=max;i++)if(!G[i])huecos.push(`${i}/${y}`);
  });
  return{sin,dup,huecos,orden};
}
const problemas=a=>a.sin+a.dup.length+a.huecos.length+a.orden.length;
function pintarAuditoria(){
  const a=analizar(),L=x=>x.slice(0,15).join(', ')+(x.length>15?` … (+${x.length-15})`:'');
  const it=(ok,t,d)=>`<li class="${ok?'ok':'bad'}"><b>${t}</b><span>${d}</span></li>`;
  $('aBody').innerHTML=`<div class="dh"><h2>Auditoría de numeración</h2><button class="x" data-close aria-label="Cerrar">&times;</button></div>
  <p class="tenue">Revisa ${all.length} actas, año por año, sin modificar nada.</p>
  <ul class="chk">
    ${it(!a.dup.length,'Números repetidos',a.dup.length?L(a.dup):'Ninguno')}
    ${it(!a.huecos.length,'Números faltantes',a.huecos.length?L(a.huecos):'Ninguno')}
    ${it(!a.orden.length,'Número fuera del orden de registro',a.orden.length?L(a.orden):'Todos siguen el orden en que se cargaron')}
    ${it(!a.sin,'Sin número asignado',a.sin?`${a.sin} registros`:'Ninguno')}
  </ul>`;
}

/* ============ LISTADO, KPIs Y RENDER ============ */
function poblarAnios(){
  const s=new Set(),hoy=+hoyIso().slice(0,4);
  for(let y=ANIO_INICIO;y<=hoy+5;y++)s.add(String(y));
  all.forEach(r=>r.year&&s.add(String(r.year)));
  const v=$('fy').value;$('fy').innerHTML=opts([...s].sort().reverse(),'Todos los años');$('fy').value=v;
}
function filtrar(){
  const q=$('q').value.trim().toLowerCase(),y=$('fy').value,m=$('fm').value,t=$('ft').value,solo=/^\d+$/.test(q);
  view=all.filter(r=>(!y||r.year==y)&&(!m||mes(r.dictamenDate)==m)&&(!t||r.topic===t)&&
    (!q||(solo&&String(r.number)===q)||(!solo&&String(r.number).includes(q))||
    [r.subject,r.topic,r.assignedUser,r.expediente,r.content,r.firmaDefensor,r.firmaDefensorSubrogante,r.firmaSecretarioNombre,r.year,fecha(r.dictamenDate)].join(' ').toLowerCase().includes(q)));
  view.sort(cmp);if(!asc)view.reverse();
  page=1;pintar();
}
function pintar(){
  const total=Math.ceil(view.length/POR_PAGINA)||1;page=Math.min(page,total);
  $('rows').innerHTML=view.slice((page-1)*POR_PAGINA,page*POR_PAGINA).map(r=>{
    const tx=!!(r.content&&r.content.trim());
    return `<tr data-id="${esc(r.id)}"><td class="n">${r.number??'—'}<span>/${esc(r.year)}</span></td><td>${fecha(r.dictamenDate)}</td>
    <td class="asunto" title="${esc(r.subject)}">${esc(r.subject)}</td><td><span class="tag">${esc(r.topic||'Sin especificar')}</span></td>
    <td class="hm">${r.assignedUser?`<span class="tag">${esc(r.assignedUser)}</span>`:'—'}</td>
    <td class="hm"><span class="tag ${tx?'si':'no'}">${tx?'Sí':'No'}</span></td><td class="hm tenue">${fmtTs(r.createdAt)}</td>
    <td><button class="ic" data-a="e" title="Editar" aria-label="Editar"><i class="fa-solid fa-pen"></i></button></td></tr>`}).join('');
  $('vacio').hidden=view.length>0;
  $('pinfo').textContent=`Página ${page} de ${total} · ${view.length} actas`;
  $('prev').disabled=page<=1;$('next').disabled=page>=total;
  $('thN').textContent=asc?'N° ↑':'N° ↓';
  // KPIs: trimestres y meses (fecha del acta) según los filtros activos
  const c=Array(12).fill(0);view.forEach(r=>{const m=mes(r.dictamenDate);if(m)c[m-1]++});
  const T=i=>c.slice(i*3,i*3+3).reduce((a,b)=>a+b,0),mx=Math.max(...c,1);
  $('kpis').innerHTML=[['Total',view.length],['Ene–Mar',T(0)],['Abr–Jun',T(1)],['Jul–Sep',T(2)],['Oct–Dic',T(3)]].map(([l,v])=>`<div><b>${v}</b><span class="tenue">${l}</span></div>`).join('');
  $('bars').innerHTML=c.map((v,i)=>`<div title="${MESES[i]}: ${v}"><i style="height:${v/mx*100}%"></i>${MESES[i].slice(0,3)}</div>`).join('');
  pintarHero();
}
function pintarHero(){
  const y=hoyIso().slice(0,4),p=problemas(analizar()),n=maxNum(y),u=all.reduce((m,r)=>String(r.year)===y?Math.max(m,ms(r.createdAt)):m,0);
  $('nextNum').innerHTML=`${n}<span>/${y}</span>`;
  $('nextHint').textContent=!n?`Aún no hay actas en ${y}`:u?`Último registro: ${fmtTs(u)}`:'';
  const b=$('integ');b.className='pill '+(p?'bad':'ok');
  b.textContent=!all.length?'Sin registros':p?`${p} observaciones en la numeración`:'Numeración íntegra y cronológica';
  $('conn').textContent=online?'Conectado · sincronización en tiempo real':'Modo local · los datos se guardan solo en este navegador';
}

/* ============ FORMULARIO ============ */
const campos=()=>({asu:$('fAsu').value,topic:$('fTopic').value,user:$('fUser').value,exp:$('fExp').value,content:$('fContent').value,firma:document.querySelector('[name=firma]:checked').value,sub:$('fSub').value,sec:$('fSec').value});
function firmaUI(){const f=document.querySelector('[name=firma]:checked').value;$('subWrap').hidden=f!=='No';$('secWrap').hidden=f!=='No firma';if(f!=='No')$('fSub').value='';if(f!=='No firma')$('fSec').value=''}
function abrirForm(id=null){
  const r=id&&all.find(x=>x.id===id);if(id&&!r)return toast('Registro no encontrado','error');
  editing=id;$('fTitulo').textContent=id?'Editar acta':'Nueva acta';
  const d=r?{asu:r.subject,fec:fecha(r.dictamenDate),topic:r.topic,user:r.assignedUser,exp:r.expediente,content:r.content,firma:r.firmaDefensor,sub:r.firmaDefensorSubrogante,sec:r.firmaSecretarioNombre}:{fec:fecha(hoyIso())};
  $('fAsu').value=d.asu||'';$('fFec').value=d.fec||'';$('fTopic').value=d.topic||'';$('fUser').value=d.user||'';
  $('fExp').value=d.exp||'';$('fContent').value=d.content||'';$('fSub').value=d.sub||'';$('fSec').value=d.sec||'';
  document.querySelector(`[name=firma][value="${['No','No firma'].includes(d.firma)?d.firma:'Sí'}"]`).checked=true;firmaUI();
  actualizarForm();$('dForm').showModal();$('fAsu').focus();
}
function actualizarForm(){
  const t=$('fContent').value.trim();$('wc').textContent=`${t?t.split(/\s+/).length:0} palabras`;
  const y=hoyIso().slice(0,4),r=editing&&all.find(x=>x.id===editing);
  $('fNumBox').innerHTML=r?`Acta <b>N° ${r.number}/${esc(r.year)}</b> · el número y la fecha no cambian al editar`:`Se asignará el <b>N° ${proximo(y)}/${y}</b> al guardar`;
  const e=norm($('fExp').value),d=e?all.filter(x=>x.id!==editing&&norm(x.expediente)===e):[];
  $('avisos').innerHTML=d.length?`<p class="av">Este expediente ya tiene ${d.length} acta(s): ${d.slice(0,4).map(x=>`N° ${x.number}/${esc(x.year)}`).join(', ')}.</p>`:'';
}
async function guardar(ev){
  ev.preventDefault();const f=campos();
  const err=!f.asu.trim()?'El asunto es obligatorio':!f.topic?'Seleccioná una temática':'';
  if(err)return toast(err,'error');
  const data={subject:f.asu.trim(),topic:f.topic,assignedUser:f.user,firmaDefensor:f.firma,
    firmaDefensorSubrogante:f.firma==='No'?f.sub.trim():'',firmaSecretarioNombre:f.firma==='No firma'?f.sec:'',expediente:f.exp.trim(),content:f.content};
  $('bSave').disabled=true;
  try{
    if(editing){await actualizar(editing,data);toast('Acta actualizada','success')}
    else{data.dictamenDate=hoyIso();data.year=data.dictamenDate.slice(0,4); // fecha automática al guardar; al editar no cambia
      const n=await crear(data);toast(`Acta N° ${n}/${data.year} registrada`,'success')}
    $('dForm').close();if(!online){poblarAnios();filtrar()}
  }catch(e){console.error(e);toast('No se pudo guardar: '+e.message,'error')}
  $('bSave').disabled=false;
}

/* ============ VISTAS Y LOCAL ============ */
const ficha=r=>{const d=(k,v)=>`<div><dt>${k}</dt><dd>${esc(v)||'—'}</dd></div>`;
  return `<dl class="dl">${d('Asunto',r.subject)}${d('Fecha de acta',fecha(r.dictamenDate))}${d('Temática',r.topic)}${d('Usuario asignado',r.assignedUser)}${d('Firma defensor titular',firmaTxt(r))}${d('Expediente',r.expediente)}${d('Registrado',fmtTs(r.createdAt))}</dl><pre class="texto">${esc(r.content)}</pre>`};
function ver(id){
  const r=all.find(x=>x.id===id);if(!r)return;
  $('vBody').innerHTML=`<div class="dh"><h2>Acta N° ${r.number}/${esc(r.year)}</h2><button class="x" data-close aria-label="Cerrar">&times;</button></div>${ficha(r)}
  <div class="df"><button class="btn" id="bCopy"><i class="fa-regular fa-copy"></i> Copiar texto</button><button class="btn pri" id="bEdit">Editar</button></div>`;
  $('bCopy').onclick=()=>navigator.clipboard?.writeText(r.content||'').then(()=>toast('Texto copiado','success'));
  $('bEdit').onclick=()=>{$('dView').close();abrirForm(id)};$('dView').showModal();
}
/* ---- Exportación a PDF (jsPDF + AutoTable) ---- */
function descFiltros(){
  const f=[],q=$('q').value.trim();
  if($('fy').value)f.push('Año '+$('fy').value);
  if($('fm').value)f.push(MESES[$('fm').value-1]);
  if($('ft').value)f.push($('ft').value);
  if(q)f.push(`Búsqueda "${q}"`);
  return f.join(' · ')||'Sin filtros';
}
function abrirExport(){
  const fl=descFiltros(),hay=fl!=='Sin filtros',fila='display:flex;align-items:flex-start;margin:0 0 12px';
  $('eBody').innerHTML=`<div class="dh"><h2>Exportar a PDF</h2><button class="x" data-close aria-label="Cerrar">&times;</button></div>
  <label class="rad" style="${fila}"><input type="radio" name="alc" value="f" ${hay?'checked':''}><span><b>Listado filtrado</b> · ${view.length} actas<br><span class="tenue">${esc(fl)}</span></span></label>
  <label class="rad" style="${fila}"><input type="radio" name="alc" value="c" ${hay?'':'checked'}><span><b>Libro completo</b> · ${all.length} actas<br><span class="tenue">Todos los años y temáticas, sin aplicar filtros</span></span></label>
  <label class="rad" style="${fila}"><input type="checkbox" id="eTexto"><span>Incluir el texto de cada acta</span></label>
  <p class="tenue">Se ordena por año y número, de menor a mayor.</p>
  <div class="df"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="bPdf"><i class="fa-solid fa-file-pdf"></i> Generar PDF</button></div>`;
  $('bPdf').onclick=()=>{if(generarPdf(document.querySelector('[name=alc]:checked').value==='c',$('eTexto').checked))$('dExport').close()};
  $('dExport').showModal();
}
function generarPdf(completo,conTexto){
  if(!window.jspdf)return toast('No se pudo cargar el generador de PDF. Revisá tu conexión.','error')||false;
  const datos=[...(completo?all:view)].sort(cmp);
  if(!datos.length)return toast('No hay actas para exportar','error')||false;
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),m=14;
  const alcance=completo?'Libro completo':'Filtrado: '+descFiltros();
  doc.setFont('helvetica','bold').setFontSize(15).setTextColor(27,38,51).text('Libro de actas',m,16);
  const sub=doc.setFont('helvetica','normal').setFontSize(9).setTextColor(91,103,118)
    .splitTextToSize(`${alcance} | ${datos.length} actas | Generado el ${new Date().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}`,W-2*m);
  doc.text(sub,m,22);
  doc.autoTable({startY:22+sub.length*4.2+3,margin:{left:m,right:m,bottom:16},rowPageBreak:'avoid',
    head:[['N°/Año','Fecha','Asunto','Temática','Usuario','Expediente']],
    body:datos.map(r=>[`${r.number??'—'}/${r.year}`,fecha(r.dictamenDate),r.subject||'',r.topic||'',r.assignedUser||'',r.expediente||'']),
    styles:{fontSize:7.5,cellPadding:1.8,textColor:[27,38,51],lineColor:[211,217,224],lineWidth:.1},
    headStyles:{fillColor:[58,61,158],textColor:255},alternateRowStyles:{fillColor:[247,248,250]},
    columnStyles:{0:{cellWidth:17,fontStyle:'bold'},1:{cellWidth:20}}});
  if(conTexto){ // texto completo de cada acta, con saltos de página automáticos
    const lh=4.6;let y=m;doc.addPage();
    const hay=h=>{if(y+h>H-16){doc.addPage();y=m}};
    const lineas=(txt,fuente,tam,col)=>{doc.setFont('helvetica',fuente).setFontSize(tam).setTextColor(...col);
      doc.splitTextToSize(txt||'',W-2*m).forEach(l=>{hay(lh);doc.text(l,m,y);y+=lh})};
    datos.forEach(r=>{
      hay(36);lineas(`Acta N° ${r.number}/${r.year}`,'bold',12,[58,61,158]);
      lineas(r.subject,'bold',9.5,[27,38,51]);
      lineas(`Fecha ${fecha(r.dictamenDate)} | ${r.topic||''} | Expte. ${r.expediente||''} | Firma: ${firmaTxt(r)}`,'normal',8,[91,103,118]);
      y+=2;lineas(r.content,'normal',9.5,[27,38,51]);
      y+=3;doc.setDrawColor(211,217,224).line(m,y,W-m,y);y+=8;
    });
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal').setFontSize(8).setTextColor(91,103,118).text(`Página ${i} de ${n}`,W/2,H-8,{align:'center'})}
  doc.save(`actas_${completo?'completo':'filtrado'}_${hoyIso()}.pdf`);
  toast('PDF generado','success');return true;
}
function cargarLocal(){try{all=(JSON.parse(localStorage.getItem(LOCAL))||[]).filter(r=>r.id)}catch(e){all=[]}poblarAnios();filtrar()}

/* ============ INICIO Y EVENTOS ============ */
function conectar(){
  if(!online)return cargarLocal();
  col().onSnapshot(s=>{
    all=s.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return{...x,id:d.id,year:String(x.year||anioDe(x.dictamenDate))}});poblarAnios();filtrar();
  },e=>{console.error(e);toast('Error de lectura en Firestore. Se usa modo local.','error');online=false;cargarLocal()});
}
document.addEventListener('DOMContentLoaded',()=>{
  $('fy').innerHTML=opts([],'Todos los años');
  $('fm').innerHTML='<option value="">Todos los meses</option>'+MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  $('ft').innerHTML=opts(TEMAS,'Todas las temáticas');$('fTopic').innerHTML=opts(TEMAS,'Seleccione una temática');
  $('fUser').innerHTML=opts(USUARIOS,'Seleccione un usuario');$('fSec').innerHTML=opts(SECRETARIOS,'Seleccione un secretario/a');
  ['q','fy','fm','ft'].forEach(i=>$(i).addEventListener('input',filtrar));
  $('bClear').onclick=()=>{['q','fy','fm','ft'].forEach(i=>$(i).value='');filtrar()};
  $('thN').onclick=()=>{asc=!asc;filtrar()};
  $('prev').onclick=()=>{page--;pintar()};$('next').onclick=()=>{page++;pintar()};
  $('bNew').onclick=$('vNew').onclick=()=>abrirForm();
  $('bExport').onclick=abrirExport;
  $('bAudit').onclick=$('integ').onclick=()=>{pintarAuditoria();$('dAudit').showModal()};
  $('rows').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;e.target.closest('[data-a=e]')?abrirForm(tr.dataset.id):ver(tr.dataset.id)};
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))d.close()}));
  $('form').onsubmit=guardar;
  $('form').addEventListener('input',actualizarForm);
  $('bClr').onclick=()=>{if(confirm('¿Está seguro de que desea limpiar todo el contenido?')){$('fContent').value='';actualizarForm()}};
  document.querySelectorAll('[name=firma]').forEach(r=>r.onchange=firmaUI);
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.key==='n'||e.key==='N'){e.preventDefault();abrirForm()}else if(e.key==='/'){e.preventDefault();$('q').focus()}
  });
  conectar();
});
</script>
